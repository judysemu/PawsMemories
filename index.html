    <script type="application/ld+json">
      {

        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://pawsome3d.com/#organization",
            "name": "Pawsome3D",

          },
          {

            "@id": "https://pawsome3d.com/#website",
            "url": "https://pawsome3d.com/",
            "name": "Pawsome3D",
            "publisher": { "@id": "https://pawsome3d.com/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Pawsome3D",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web",
            "url": "https://pawsome3d.com/",
            "description": "A web studio for creating 3D pet models, AI videos, custom styles, and printable keepsakes from photos.",

          },
          {
            "@type": "3DModel",
            "@id": "https://pawsome3d.com/#barkley-presenter",
            "name": "Barkley, the Pawsome3D presenter",
            "description": "An animated 3D dog that guides visitors through the studio, rendered live in the browser.",

              "@type": "MediaObject",
              "contentUrl": "https://pawsome3d.com/barkley/wave_bye.glb",
              "encodingFormat": "model/gltf-binary"
            },
            "interactivityType": "rotate, zoom, animate",
            "isPartOf": { "@id": "https://pawsome3d.com/#website" }
          },
          {
            "@type": "ItemList",
            "@id": "https://pawsome3d.com/#famous-portraits-collection",
            "name": "Famous Pet Portraits & Themed Keepsakes",
            "description": "Portrait categories a pet can be styled into, from historic figures to seasonal themes.",
            "itemListOrder": "https://schema.org/ItemListUnordered",
            "numberOfItems": 7,
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "name": "Historic Women" },
              { "@type": "ListItem", "position": 2, "name": "Presidents & World Leaders" },

          }

  <body>
    <div id="root"></div>
    <!-- The app navigates by React state, so this block is the only place the
         served HTML contains real <a href> links. Before it existed the whole
         site linked to exactly two pages -- Privacy and Terms -- which is why
         those were the only ones Google crawled well, and why /barkley,
         /dog-3d-models and /cat-3d-models were reported "URL is unknown to
         Google" despite sitting in the sitemap.

         The heading and description are rewritten per route by injectMeta();
         without that every page served this same h1, so to a crawler all 29
         routes looked like copies of one page whose visible heading contradicted
         its own title. Keep the ids -- the injection matches on them. -->
    <noscript>
      <main>
        <h1 id="noscript-heading">Create 3D pet models, videos, and keepsakes with Pawsome3D</h1>
        <p id="noscript-description">Pawsome3D turns pet photos into 3D models, animated videos, custom styles, Pawprints designs, and shareable digital keepsakes.</p>

        </nav>
